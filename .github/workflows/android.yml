name: CalculatorVault Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Validate APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Verify APK signature and metadata
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -q "package: name='com.app.calculatorvault'" apk-badging.txt
          grep -q "sdkVersion:'21'" apk-badging.txt

      - name: Check APK is a normal universal Java APK
        shell: bash
        run: |
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q '^classes.dex$'
          if unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q '^lib/'; then
            echo "Unexpected native libraries found:"
            unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep '^lib/' || true
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CalculatorVault-v2.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorVault-v2.1.0-APK
          path: CalculatorVault-v2.1.0.apk
          if-no-files-found: error
